# Single entry point for the whole app: serves the built frontend as static
# files and reverse-proxies /api to gunicorn. Frontend and API share one
# origin this way, so browser CORS never enters the picture in production.
#
# Copy to /etc/nginx/sites-available/csr-app, symlink into sites-enabled,
# then run certbot --nginx to fill in the TLS block automatically.

server {
    listen 80;
    server_name yourdomain.com;

    root /home/ubuntu/csr-funding-portal/frontend/dist;
    index index.html;

    # API traffic -> gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> the React SPA (client-side routing fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
